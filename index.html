<!doctype html>
<html>
  <html>
    <head>
      <title>Проект "Комменты"</title>
      <meta charset="utf-8" />
      <link rel="stylesheet" href="styles.css" />
    </head>

    <body>
      <div class="container">
        <div id="comments-loading" class="com-loading">
          <p class="com-load_text">Загрузка комментариев...</p>
        </div>

        <ul id="ul" class="comments"></ul>

        <div id="add-loading" class="add-load">
          <p class="add-load_text">Комментарий добавляется...</p>
        </div>

        <div id="comment-form" class="add-form">
          <textarea
            type="textarea"
            id="comments"
            class="add-form-text"
            placeholder="Введите ваш комментарий"
            rows="4"
          ></textarea>
          <div class="add-form-row">
            <button id="massage" class="add-form-button">Написать</button>
          </div>
          <div id="errorMessage" class="error-message"></div>
        </div>

        <div id="login-prompt" class="auth-promo">
          <div class="auth-promo-content">
            <p class="auth-promo-text">
              Чтобы добавить комментарий, войдите в систему
            </p>
            <a href="login.html" class="auth-promo-button"
              >Войти / Зарегистрироваться</a
            >
            <p class="auth-promo-register">
              Нет аккаунта?
              <a href="register.html">Зарегистрируйтесь</a>
              всего за минуту!
            </p>
          </div>
        </div>
      </div>

      <!-- Ссылка для неавторизованных пользователей -->

      <script type="module" src="main.js"></script>
    </body>
  </html>
</html>
